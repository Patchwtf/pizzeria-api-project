spring.application.name=pizzeria-api-project
server.servlet.context-path=/pizzeria

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pizzeria?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ruta de la UI (opcional)
springdoc.swagger-ui.path=/swagger-ui.html
# Ruta del JSON (opcional)
springdoc.api-docs.path=/api-docs
# Ordenar tags alfabéticamente
springdoc.swagger-ui.tagsSorter=alpha
# Ordenar operaciones
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
# Si expones endpoints de Actuator
springdoc.show-actuator=true